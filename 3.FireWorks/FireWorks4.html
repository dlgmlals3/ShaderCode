uniform vec3        iResolution;
uniform float       iTime;
uniform float       iTimeDelta;

uniform sampler2D   iChannel9;
uniform sampler2D   iKeyboard;
uniform float       iSampleRate;

#define iGlobalTime iTime
#define iGlobalFrame iFrame

#define SHADER_TOY


// 0. 가운데 밝은점 만들어보기
// 1. hash 함수 생성
// 2. hash를 랜덤함수로 렌더링해보자
// 3. hash 함수 -.5 만들어서 -.5~.5 영역으로 설정 뒤, uv 값에 더해줌
// 4. hash 함수와 time 함수를 통하여 한점이 움직이는 애니메이션 만듬

// 5. 1~4과정을 for loop를 묶고 hash 함수 내부 파라메터를 수정하여 사각 형태의 explosion 만들어봄
// 6. polar hash 함수 생성
// 7. 원형 폭발과정 렌더링
// 8. 원형 잔해 mix를 통하여 밝기 조절
// 9. 원형 잔해 폭발 random 하게 조절 (bright 수정) --> Explosion 함수로..

// Tomorrow

#define NUM_PARTICLE 95.
#define NUM_EXPLOSION 5.
 
vec2 Hash12(float t) {
    float x = fract(sin(t * 1243.165) * 145.524);
    float y = fract(sin((t + x) * 121.672) * 2415.12);
    return vec2(x, y);
}
vec2 HashPolar12(float t) {
    float theta = fract(sin(t*673.2) * 435.3) * 6.2832;
    float r = fract(sin((t + theta) * 121.62) * 241.12);
    return vec2(sin(theta), cos(theta)) * r;
}
float Explosion(vec2 uv, float t) {
    float explod = 0.;
    for (float i=0.; i< NUM_PARTICLE; i++) {
        vec2 dir = HashPolar12((i + .1) * .01); // 6
         
        float brightness = mix(.0003, .001, smoothstep(.1, .5, t)); // 7
        brightness *= smoothstep(1., .7, t); // 12
        float sparkle = sin(t * i * .5) * .5 + .5; // 8
        
        float d = length(uv - dir * t);         
        explod += brightness * sparkle / d;
    }    
    return explod;
}

void mainImage( out vec4 fragColor, in vec2 fragCoord )
{
    vec3 col = vec3(0.);
    vec2 uv = (fragCoord - .5 * iResolution.xy) / iResolution.y;
    float sparkle = 0.;
    float t = fract(iTime);

    float firewalks = 0.;
    for (float i=0.; i < NUM_EXPLOSION; i++) { // 13
        
        float t = iTime + (i / NUM_EXPLOSION); // 15
        float ft = floor(t); // 11
    
        vec3 color = sin(4. * vec3(.34, .54, .43) * ft) * .25 + .75; // 10
        vec2 offs = Hash12(i + 1. + ft) - .5; // 14
        offs *= vec2(1.77, 1.);
        col += Explosion(uv - offs, fract(t) * .4) * color;
    }
   
    fragColor = vec4(col,1.0);
}
void main() {
    vec2 fragCoord = gl_FragCoord.xy;
    mainImage(gl_FragColor, fragCoord);
}
</script>

<script type="text/javascript">

            let errorRegex = /ERROR: \d+:(\d+):\W(.*)\n/g;

            let match;
            
            let diagnostics = [];
            let message = '';
            while(match = errorRegex.exec(rawErrors)) {
                let lineNumber = Number(match[1]) - currentShader.LineOffset;
                let error = match[2];
                diagnostics.push({
                    line: lineNumber,
                    message: error
                });
                let lineHighlight = `<a class='error' unselectable onclick='revealError(${lineNumber}, "${currentShader.File}")'>Line ${lineNumber}</a>`;
                message += `<li>${lineHighlight}: ${error}</li>`;

            };

                vscode.postMessage({
                    command: 'showGlslDiagnostic',
                    type: 'error',

            $('#message').append('<ul>');

    // Development feature: Output warnings from third-party libraries

    {

    {

    {

    // Audio Resume

    let compileTimeStart = performance.now();

    for (let include of commonIncludes) {

            // add two for version and precision lines

    function addLineNumbers( string ) {
        let lines = string.split( '\\n' );
        for ( let i = 0; i < lines.length; i ++ ) {
            lines[ i ] = ( i + 1 ) + ': ' + lines[ i ];
        }
        return lines.join( '\\n' );
    }

    function compileFragShader(gl, fsSource) {
        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, fsSource);
        gl.compileShader(fs);
        if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
            const fragmentLog = gl.getShaderInfoLog(fs);
            console.error( 'THREE.WebGLProgram: shader error: ', gl.getError(), 'gl.COMPILE_STATUS', null, null, null, null, fragmentLog );
            return false;
        }
        return true;
    }

        requestAnimationFrame(render);
        if (!forceRenderOneFrame) {

            if (paused) return;

                for (let dependent of buffer.Dependents) {
                    const dependentBuffer = buffers[dependent.Index];

    function forceAspectRatio(width, height) {
        // Forced aspect ratio
        let forcedAspects = [0,0];
        let forcedAspectRatio = forcedAspects[0] / forcedAspects[1];
        let aspectRatio = width / height;

        if (forcedAspectRatio <= 0 || !isFinite(forcedAspectRatio)) {
            let resolution = new THREE.Vector3(width, height, 1.0);
            return resolution;
        }
        else if (aspectRatio < forcedAspectRatio) {
            let resolution = new THREE.Vector3(width, Math.floor(width / forcedAspectRatio), 1);
            return resolution;
        }
        else {
            let resolution = new THREE.Vector3(Math.floor(height * forcedAspectRatio), height, 1);
            return resolution;
        }
    }
    function computeSize() {
        
        // Compute forced aspect ratio and align canvas
        resolution = forceAspectRatio(window.innerWidth, window.innerHeight);
        canvas.style.left = `${(window.innerWidth - resolution.x) / 2}px`;
        canvas.style.top = `${(window.innerHeight - resolution.y) / 2}px`;

        for (let buffer of buffers) {
            if (buffer.Target) {
                buffer.Target.setSize(resolution.x, resolution.y);

        }

        updateMouse();
    }, false);
    canvas.addEventListener('mouseup', function(evt) {
        if (evt.button == 0)
            mouseButton.x = 0;
        if (evt.button == 2)
            mouseButton.y = 0;

        dragging = false;
        mouse.z = -mouse.z;
        mouse.w = -mouse.w;

        updateMouse();
    }, false);
    window.addEventListener('resize', function() {
        computeSize();
